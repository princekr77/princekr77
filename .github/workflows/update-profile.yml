name: Update Live Profile Stats

on:
  schedule:
    # Run every 12 hours to sync live GitHub statistics
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'build_profile.py'

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Build Live SVGs
        run: python build_profile.py

      - name: Commit and Push Live Stats Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No live stats changes detected."
          else
            git commit -m "Auto-update live profile stats [skip ci]"
            git push origin main
          fi
