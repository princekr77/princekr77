<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="100%" height="auto">
  <defs>
    
    <linearGradient id="c7_card_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="c7_glow_cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="c7_subcard_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="100%" stop-color="#070C15"/>
    </linearGradient>
    <filter id="c7_softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="c7_avatar_clip">
      <circle cx="720" cy="180" r="82"/>
    </clipPath>
    <clipPath id="c7_devpass_clip">
      <circle cx="130" cy="120" r="42"/>
    </clipPath>
    
  </defs>

